# dsh-access-gateway bundle patch.
#
# Installed through the official CLI —
#
#   dsh plugin --profile web add <path-or-package>
#
# — the command reconciles dsh.profile.bundles against installed packages and,
# seeing this declaration, mounts the row below. The manual equivalent in the
# profile's cordis.patch.yml is the same insert list.
#
# The row carries the whole configuration: the address to serve, the port, the
# gateway password, and how long a passed login lasts. Leaving `bind` empty
# serves the first non-loopback address the machine reports. Leaving `password`
# empty lets the Host generate one on the first run and show it in Settings; from
# there the Settings page owns it, including switching it off for a network you
# trust.
- insert:
    - id: access-gateway
      name: 'dsh-access-gateway'
      config:
        bind: ''
        port: 3081
        password: ''
        sessionDays: 30
